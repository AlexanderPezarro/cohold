name: Bug report
description: Something is not working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug.

        **Do not report security vulnerabilities here** — please use
        [private vulnerability reporting](https://github.com/AlexanderPezarro/cohold/security)
        instead.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: dropdown
    id: install-type
    attributes:
      label: How are you running Cohold?
      options:
        - Self-hosted (Docker)
        - Self-hosted (bare metal / systemd)
        - Local development
        - Hosted instance
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Release tag, image tag, or commit SHA.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Server logs or browser console output. This is rendered as code, so no backticks needed.
      render: shell

  - type: textarea
    id: context
    attributes:
      label: Anything else?
      description: Screenshots, browser and OS, or other context.
