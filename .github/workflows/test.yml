name: Test

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: file:./data/ci-test.db

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install client dependencies
        run: cd client && npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      # Kept as a check that the migrations apply cleanly. The test run no
      # longer depends on it: jest.globalSetup.cjs migrates its own template
      # database, which each test file copies.
      - name: Run database migrations
        run: npx prisma migrate deploy

      # --runInBand and --forceExit are no longer needed: every test file gets
      # its own SQLite file, and forceExit lives in jest.config.js.
      - name: Run tests with coverage
        run: npm run test:coverage
