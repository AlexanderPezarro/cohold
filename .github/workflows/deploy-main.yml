name: Build Production Images

on:
  push:
    branches: [main]

concurrency:
  group: build-production-images
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_BASE: ghcr.io/alexanderpezarro/cohold-base
  IMAGE_APP: ghcr.io/alexanderpezarro/cohold

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      rebuild-base: ${{ steps.changes.outputs.rebuild }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for dependency changes
        id: changes
        run: |
          if git diff --name-only HEAD^ HEAD | grep -qE '^(package(-lock)?\.json|client/package(-lock)?\.json|prisma/schema\.prisma|Dockerfile\.base)$'; then
            echo "rebuild=true" >> $GITHUB_OUTPUT
            echo "✓ Base image rebuild required - dependencies changed"
          else
            echo "rebuild=false" >> $GITHUB_OUTPUT
            echo "✓ Skipping base image rebuild - no dependency changes"
          fi

  build-base:
    needs: check-changes
    if: needs.check-changes.outputs.rebuild-base == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push base image
        run: |
          docker build --platform linux/amd64 \
            -t ${{ env.IMAGE_BASE }}:latest \
            -t ${{ env.IMAGE_BASE }}:${{ github.sha }} \
            -f Dockerfile.base .
          docker push ${{ env.IMAGE_BASE }}:latest
          docker push ${{ env.IMAGE_BASE }}:${{ github.sha }}

  build-app:
    needs: [check-changes, build-base]
    if: always() && needs.check-changes.result == 'success' && (needs.build-base.result == 'success' || needs.build-base.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push app image
        run: |
          docker build --platform linux/amd64 \
            -t ${{ env.IMAGE_APP }}:latest \
            -t ${{ env.IMAGE_APP }}:${{ github.sha }} \
            -f Dockerfile.app .
          docker push ${{ env.IMAGE_APP }}:latest
          docker push ${{ env.IMAGE_APP }}:${{ github.sha }}
