name: Deploy to Production

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_BASE: ghcr.io/alexanderpezarro/cohold-base
  IMAGE_APP: ghcr.io/alexanderpezarro/cohold

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      rebuild-base: ${{ steps.changes.outputs.rebuild }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for dependency changes
        id: changes
        run: |
          if git diff --name-only HEAD^ HEAD | grep -qE '^(package(-lock)?\.json|client/package(-lock)?\.json|prisma/schema\.prisma|Dockerfile\.base)$'; then
            echo "rebuild=true" >> $GITHUB_OUTPUT
            echo "✓ Base image rebuild required - dependencies changed"
          else
            echo "rebuild=false" >> $GITHUB_OUTPUT
            echo "✓ Skipping base image rebuild - no dependency changes"
          fi

  build-base:
    needs: check-changes
    if: needs.check-changes.outputs.rebuild-base == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push base image
        run: |
          docker build --platform linux/amd64 \
            -t ${{ env.IMAGE_BASE }}:latest \
            -t ${{ env.IMAGE_BASE }}:${{ github.sha }} \
            -f Dockerfile.base .
          docker push ${{ env.IMAGE_BASE }}:latest
          docker push ${{ env.IMAGE_BASE }}:${{ github.sha }}

  build-app:
    needs: [check-changes, build-base]
    if: always() && needs.check-changes.result == 'success' && (needs.build-base.result == 'success' || needs.build-base.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push app image
        run: |
          docker build --platform linux/amd64 \
            -t ${{ env.IMAGE_APP }}:latest \
            -t ${{ env.IMAGE_APP }}:${{ github.sha }} \
            -f Dockerfile.app .
          docker push ${{ env.IMAGE_APP }}:latest
          docker push ${{ env.IMAGE_APP }}:${{ github.sha }}

  deploy-production:
    needs: [check-changes, build-app]
    if: always() && needs.check-changes.result == 'success' && needs.build-app.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci

      - name: Sync compose file
        run: |
          scp -o StrictHostKeyChecking=accept-new compose.yaml \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/srv/cohold/compose.yaml"

      - name: Clean up legacy compose file
        run: |
          ssh -o StrictHostKeyChecking=accept-new \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "rm -f /srv/cohold/docker-compose.yml"

      - name: Deploy to production
        run: |
          ssh -o StrictHostKeyChecking=accept-new \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "cd /srv/cohold && docker compose pull cohold-prod && docker compose up -d cohold-prod"

      - name: Health check
        run: |
          echo "Running health checks on production (via SSH to bypass Cloudflare)..."
          ssh -o StrictHostKeyChecking=accept-new \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            'for i in $(seq 1 12); do
               echo "Attempt $i/12..."
               if docker exec cohold-prod node -e "
                 require(\"http\").get(\"http://localhost:3000/api/health\", r => process.exit(r.statusCode === 200 ? 0 : 1)).on(\"error\", () => process.exit(1))
               " 2>/dev/null; then
                 echo "✓ Production health check passed"
                 exit 0
               fi
               echo "✗ Not ready yet, retrying in 10s..."
               sleep 10
             done
             echo "Health check failed"
             docker logs cohold-prod --tail 20
             exit 1'
