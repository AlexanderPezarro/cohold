name: Build Production Images

# Rollouts are performed by the provisioner, which polls `cohold:latest` on its
# own schedule — CI cannot gate the deploy itself. So it gates the tag instead:
# every build is pushed under its commit SHA, smoke tested, and only promoted to
# :latest once green. `:latest` is therefore smoke-tested by construction, and a
# bad merge leaves it pointing at the last good image rather than rolling out.

on:
  push:
    branches: [main]

concurrency:
  group: build-production-images
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_BASE: ghcr.io/${{ github.repository_owner }}/cohold-base
  IMAGE_APP: ghcr.io/${{ github.repository_owner }}/cohold

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      rebuild-base: ${{ steps.changes.outputs.rebuild }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for dependency changes
        id: changes
        run: |
          if git diff --name-only HEAD^ HEAD | grep -qE '^(package(-lock)?\.json|client/package(-lock)?\.json|prisma/schema\.prisma|Dockerfile\.base)$'; then
            echo "rebuild=true" >> $GITHUB_OUTPUT
            echo "✓ Base image rebuild required - dependencies changed"
          else
            echo "rebuild=false" >> $GITHUB_OUTPUT
            echo "✓ Skipping base image rebuild - no dependency changes"
          fi

  build-base:
    needs: check-changes
    if: needs.check-changes.outputs.rebuild-base == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # SHA tag only. :latest is promoted in the `promote` job below, so a base
      # image whose app build fails smoke never becomes the default base.
      - name: Build and push base image
        run: |
          docker build --platform linux/amd64 \
            -t ${{ env.IMAGE_BASE }}:${{ github.sha }} \
            -f Dockerfile.base .
          docker push ${{ env.IMAGE_BASE }}:${{ github.sha }}

  build-app:
    needs: [check-changes, build-base]
    if: always() && needs.check-changes.result == 'success' && (needs.build-base.result == 'success' || needs.build-base.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Resolve the base to an immutable digest so the app image can never be
      # built on a base that shifted under it between jobs.
      - name: Resolve base image digest
        id: base
        run: |
          if [ "${{ needs.check-changes.outputs.rebuild-base }}" = "true" ]; then
            REF="${{ env.IMAGE_BASE }}:${{ github.sha }}"
          else
            REF="${{ env.IMAGE_BASE }}:latest"
          fi
          DIGEST=$(docker buildx imagetools inspect "$REF" --format '{{ .Manifest.Digest }}')
          echo "Base image: $REF -> $DIGEST"
          echo "image=${{ env.IMAGE_BASE }}@${DIGEST}" >> $GITHUB_OUTPUT

      - name: Build and push app image
        run: |
          docker build --platform linux/amd64 \
            --build-arg BASE_IMAGE=${{ steps.base.outputs.image }} \
            -t ${{ env.IMAGE_APP }}:${{ github.sha }} \
            -f Dockerfile.app .
          docker push ${{ env.IMAGE_APP }}:${{ github.sha }}

  smoke-test:
    needs: build-app
    # `always()` is load-bearing: GitHub propagates a skip transitively through
    # the needs graph, so when build-base skips (the common case — no dependency
    # change) this job would skip too, despite build-app having succeeded. That
    # would leave `promote` seeing a non-success smoke result and quietly stop
    # :latest from ever moving again.
    if: always() && needs.build-app.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image under test
        run: docker pull ${{ env.IMAGE_APP }}:${{ github.sha }}

      - uses: ./.github/actions/smoke-test
        with:
          image: ${{ env.IMAGE_APP }}:${{ github.sha }}
          smoke-password: ${{ secrets.SMOKE_TEST_PASSWORD }}
          artifact-name: playwright-report-main-${{ github.sha }}

  promote:
    needs: [check-changes, build-base, smoke-test]
    if: always() && needs.smoke-test.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Re-tags the existing manifest; no rebuild, so the promoted image is
      # byte-identical to the one that passed smoke.
      - name: Promote base image to :latest
        if: needs.check-changes.outputs.rebuild-base == 'true'
        run: |
          docker buildx imagetools create \
            -t ${{ env.IMAGE_BASE }}:latest \
            ${{ env.IMAGE_BASE }}:${{ github.sha }}

      - name: Promote app image to :latest
        run: |
          docker buildx imagetools create \
            -t ${{ env.IMAGE_APP }}:latest \
            ${{ env.IMAGE_APP }}:${{ github.sha }}
          echo "✓ ${{ env.IMAGE_APP }}:latest now points at ${{ github.sha }}"
          echo "  The provisioner will roll it out on its next poll."
