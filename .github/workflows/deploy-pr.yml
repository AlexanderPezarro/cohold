name: Deploy PR to Staging

# The smoke test runs on the runner against a throwaway container built from the
# PR's own image — it does not touch the deploy host. The staging deployment is
# kept purely as a human-clickable preview and runs in parallel with it, so PRs
# no longer serialise behind the shared staging box to get a merge signal.

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  pull-requests: write
  packages: write

concurrency:
  group: deploy-pr-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_BASE: ghcr.io/alexanderpezarro/cohold-base
  IMAGE_APP: ghcr.io/alexanderpezarro/cohold
  STAGING_URL: https://cohold-staging.example.com

jobs:
  # The staging preview needs Tailscale + SSH access to the deploy host. Those
  # secrets are optional now that the merge gate no longer depends on them, so
  # the preview jobs skip cleanly when they are absent rather than failing every
  # PR. (The `secrets` context is not available in a job-level `if`, hence this
  # job existing purely to turn it into a `needs` output.)
  check-secrets:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}
    steps:
      - id: check
        env:
          TS_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          if [ -n "$TS_ID" ] && [ -n "$DEPLOY_HOST" ]; then
            echo "deploy=true" >> $GITHUB_OUTPUT
            echo "✓ Deploy secrets present - staging preview will run"
          else
            echo "deploy=false" >> $GITHUB_OUTPUT
            echo "::notice title=Staging preview skipped::TS_OAUTH_CLIENT_ID / DEPLOY_HOST are not configured, so the staging preview is skipped. The smoke test is unaffected - it runs on the runner."
          fi

  check-changes:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    outputs:
      rebuild-base: ${{ steps.changes.outputs.rebuild }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for dependency changes
        id: changes
        run: |
          BASE_SHA=${{ github.event.pull_request.base.sha }}
          HEAD_SHA=${{ github.event.pull_request.head.sha }}
          # Three-dot: compare against the merge base, i.e. what this PR actually
          # changed. A two-dot diff also reports everything that landed on main
          # since the branch point, so any PR sitting behind main triggered a
          # spurious ~4min base rebuild whenever Renovate had merged a bump.
          if git diff --name-only "$BASE_SHA...$HEAD_SHA" | grep -qE '^(package(-lock)?\.json|client/package(-lock)?\.json|prisma/schema\.prisma|Dockerfile\.base)$'; then
            echo "rebuild=true" >> $GITHUB_OUTPUT
            echo "✓ Base image rebuild required - dependencies changed"
          else
            echo "rebuild=false" >> $GITHUB_OUTPUT
            echo "✓ Skipping base image rebuild - no dependency changes"
          fi

  build-base:
    needs: check-changes
    if: needs.check-changes.outputs.rebuild-base == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # SHA tag only — a PR must never move the :latest base tag that main's
      # builds consume by default.
      - name: Build and push base image
        run: |
          docker build --platform linux/amd64 \
            -t ${{ env.IMAGE_BASE }}:${{ github.sha }} \
            -f Dockerfile.base .
          docker push ${{ env.IMAGE_BASE }}:${{ github.sha }}

  build-app:
    needs: [check-changes, build-base]
    if: always() && needs.check-changes.result == 'success' && (needs.build-base.result == 'success' || needs.build-base.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve base image digest
        id: base
        run: |
          if [ "${{ needs.check-changes.outputs.rebuild-base }}" = "true" ]; then
            REF="${{ env.IMAGE_BASE }}:${{ github.sha }}"
          else
            REF="${{ env.IMAGE_BASE }}:latest"
          fi
          DIGEST=$(docker buildx imagetools inspect "$REF" --format '{{ .Manifest.Digest }}')
          echo "Base image: $REF -> $DIGEST"
          echo "image=${{ env.IMAGE_BASE }}@${DIGEST}" >> $GITHUB_OUTPUT

      - name: Build and push PR image
        run: |
          docker build --platform linux/amd64 \
            --build-arg BASE_IMAGE=${{ steps.base.outputs.image }} \
            -t ${{ env.IMAGE_APP }}:pr-${{ github.event.pull_request.number }} \
            -t ${{ env.IMAGE_APP }}:${{ github.sha }} \
            -f Dockerfile.app .
          docker push ${{ env.IMAGE_APP }}:pr-${{ github.event.pull_request.number }}
          docker push ${{ env.IMAGE_APP }}:${{ github.sha }}

  # The merge gate. Runs on the runner against the immutable SHA tag, so it is
  # unaffected by anything else deploying to staging at the same time.
  smoke-test:
    needs: build-app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image under test
        run: docker pull ${{ env.IMAGE_APP }}:${{ github.sha }}

      - uses: ./.github/actions/smoke-test
        id: smoke
        with:
          image: ${{ env.IMAGE_APP }}:${{ github.sha }}
          smoke-password: ${{ secrets.SMOKE_TEST_PASSWORD }}
          artifact-name: playwright-report-pr-${{ github.event.pull_request.number }}

      - name: Comment smoke test result
        if: always()
        uses: actions/github-script@v7
        env:
          PASSED: ${{ job.status == 'success' }}
        with:
          script: |
            const marker = '<!-- smoke-test-comment -->';
            const passed = process.env.PASSED === 'true';
            const runUrl = `https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            const body = [
              marker,
              passed
                ? '**Smoke tests passed** ✓'
                : `**Smoke tests failed** ✗ — [see run and Playwright report](${runUrl})`,
              '',
              `Ran against \`${{ env.IMAGE_APP }}:${context.sha.substring(0, 7)}\` in an isolated container.`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  # Preview only — not a merge gate. Serialised on the shared staging box.
  deploy-staging:
    needs: [build-app, check-secrets]
    if: needs.check-secrets.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci

      - name: Sync compose file
        run: |
          scp -o StrictHostKeyChecking=accept-new compose.yaml \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/srv/cohold/compose.yaml"

      - name: Clean up legacy compose file
        run: |
          ssh -o StrictHostKeyChecking=accept-new \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "rm -f /srv/cohold/docker-compose.yml"

      - name: Deploy PR to staging
        run: |
          ssh -o StrictHostKeyChecking=accept-new \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "cd /srv/cohold && \
             STAGING_TAG=pr-${{ github.event.pull_request.number }} docker compose pull cohold-staging && \
             STAGING_TAG=pr-${{ github.event.pull_request.number }} docker compose up -d cohold-staging"

      - name: Health check
        run: |
          echo "Running health checks on staging (via SSH to bypass Cloudflare)..."
          ssh -o StrictHostKeyChecking=accept-new \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            'for i in $(seq 1 12); do
               echo "Attempt $i/12..."
               if docker exec cohold-staging node -e "
                 require(\"http\").get(\"http://localhost:3000/api/health\", r => process.exit(r.statusCode === 200 ? 0 : 1)).on(\"error\", () => process.exit(1))
               " 2>/dev/null; then
                 echo "✓ Staging health check passed"
                 exit 0
               fi
               echo "✗ Not ready yet, retrying in 10s..."
               sleep 10
             done
             echo "Health check failed"
             docker logs cohold-staging --tail 20
             exit 1'

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- staging-preview-comment -->';
            const body = [
              marker,
              '**Staging preview ready!**',
              '',
              '| | |',
              '|---|---|',
              `| **URL** | ${{ env.STAGING_URL }} |`,
              `| **Commit** | \`${context.sha.substring(0, 7)}\` |`,
              `| **Image** | \`pr-${{ github.event.pull_request.number }}\` |`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  revert-staging:
    needs: check-secrets
    if: github.event.action == 'closed' && needs.check-secrets.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci

      - name: Revert staging to latest
        run: |
          ssh -o StrictHostKeyChecking=accept-new \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "cd /srv/cohold && \
             STAGING_TAG=latest docker compose pull cohold-staging && \
             STAGING_TAG=latest docker compose up -d cohold-staging"
