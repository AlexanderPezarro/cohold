name: PR Build and Smoke Test

# Builds the PR's image and runs the smoke suite against a throwaway container
# on the runner. Nothing here touches a deploy host: production rollouts are
# pull-based, performed by the provisioner when it sees a new :latest.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  packages: write

concurrency:
  group: deploy-pr-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_BASE: ghcr.io/${{ github.repository_owner }}/cohold-base
  IMAGE_APP: ghcr.io/${{ github.repository_owner }}/cohold

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      rebuild-base: ${{ steps.changes.outputs.rebuild }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for dependency changes
        id: changes
        run: |
          BASE_SHA=${{ github.event.pull_request.base.sha }}
          HEAD_SHA=${{ github.event.pull_request.head.sha }}
          # Three-dot: compare against the merge base, i.e. what this PR actually
          # changed. A two-dot diff also reports everything that landed on main
          # since the branch point, so any PR sitting behind main triggered a
          # spurious ~4min base rebuild whenever Renovate had merged a bump.
          if git diff --name-only "$BASE_SHA...$HEAD_SHA" | grep -qE '^(package(-lock)?\.json|client/package(-lock)?\.json|prisma/schema\.prisma|Dockerfile\.base)$'; then
            echo "rebuild=true" >> $GITHUB_OUTPUT
            echo "✓ Base image rebuild required - dependencies changed"
          else
            echo "rebuild=false" >> $GITHUB_OUTPUT
            echo "✓ Skipping base image rebuild - no dependency changes"
          fi

  build-base:
    needs: check-changes
    if: needs.check-changes.outputs.rebuild-base == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Normalise GHCR namespace to lowercase
        run: |
          # Docker repository names must be lowercase, but github.repository_owner
          # preserves the account's case (e.g. AlexanderPezarro). Recompute the
          # image refs here; $GITHUB_ENV overrides the workflow-level defaults.
          OWNER=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_BASE=ghcr.io/$OWNER/cohold-base" >> $GITHUB_ENV
          echo "IMAGE_APP=ghcr.io/$OWNER/cohold" >> $GITHUB_ENV
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # SHA tag only — a PR must never move the :latest base tag that main's
      # builds consume by default.
      - name: Build and push base image
        run: |
          docker build --platform linux/amd64 \
            -t ${{ env.IMAGE_BASE }}:${{ github.sha }} \
            -f Dockerfile.base .
          docker push ${{ env.IMAGE_BASE }}:${{ github.sha }}

  build-app:
    needs: [check-changes, build-base]
    if: always() && needs.check-changes.result == 'success' && (needs.build-base.result == 'success' || needs.build-base.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Normalise GHCR namespace to lowercase
        run: |
          # Docker repository names must be lowercase, but github.repository_owner
          # preserves the account's case (e.g. AlexanderPezarro). Recompute the
          # image refs here; $GITHUB_ENV overrides the workflow-level defaults.
          OWNER=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_BASE=ghcr.io/$OWNER/cohold-base" >> $GITHUB_ENV
          echo "IMAGE_APP=ghcr.io/$OWNER/cohold" >> $GITHUB_ENV
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve base image digest
        id: base
        run: |
          if [ "${{ needs.check-changes.outputs.rebuild-base }}" = "true" ]; then
            REF="${{ env.IMAGE_BASE }}:${{ github.sha }}"
          else
            REF="${{ env.IMAGE_BASE }}:latest"
          fi
          DIGEST=$(docker buildx imagetools inspect "$REF" --format '{{ .Manifest.Digest }}')
          echo "Base image: $REF -> $DIGEST"
          echo "image=${{ env.IMAGE_BASE }}@${DIGEST}" >> $GITHUB_OUTPUT

      - name: Build and push PR image
        run: |
          docker build --platform linux/amd64 \
            --build-arg BASE_IMAGE=${{ steps.base.outputs.image }} \
            -t ${{ env.IMAGE_APP }}:pr-${{ github.event.pull_request.number }} \
            -t ${{ env.IMAGE_APP }}:${{ github.sha }} \
            -f Dockerfile.app .
          docker push ${{ env.IMAGE_APP }}:pr-${{ github.event.pull_request.number }}
          docker push ${{ env.IMAGE_APP }}:${{ github.sha }}

  # The merge gate. Runs on the runner against the immutable SHA tag.
  smoke-test:
    needs: build-app
    # `always()` is load-bearing: GitHub propagates a skip transitively through
    # the needs graph, so when build-base skips (the common case — no dependency
    # change) this job would skip too, despite build-app having succeeded. A
    # skipped required check does not block a merge, which would silently leave
    # the repo with no smoke gate at all.
    if: always() && needs.build-app.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Normalise GHCR namespace to lowercase
        run: |
          # Docker repository names must be lowercase, but github.repository_owner
          # preserves the account's case (e.g. AlexanderPezarro). Recompute the
          # image refs here; $GITHUB_ENV overrides the workflow-level defaults.
          OWNER=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_BASE=ghcr.io/$OWNER/cohold-base" >> $GITHUB_ENV
          echo "IMAGE_APP=ghcr.io/$OWNER/cohold" >> $GITHUB_ENV
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image under test
        run: docker pull ${{ env.IMAGE_APP }}:${{ github.sha }}

      - uses: ./.github/actions/smoke-test
        id: smoke
        with:
          image: ${{ env.IMAGE_APP }}:${{ github.sha }}
          smoke-password: ${{ secrets.SMOKE_TEST_PASSWORD }}
          artifact-name: playwright-report-pr-${{ github.event.pull_request.number }}

      - name: Comment smoke test result
        if: always()
        uses: actions/github-script@v7
        env:
          PASSED: ${{ job.status == 'success' }}
        with:
          script: |
            const marker = '<!-- smoke-test-comment -->';
            const passed = process.env.PASSED === 'true';
            const runUrl = `https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            const body = [
              marker,
              passed
                ? '**Smoke tests passed** ✓'
                : `**Smoke tests failed** ✗ — [see run and Playwright report](${runUrl})`,
              '',
              `Ran against \`${{ env.IMAGE_APP }}:${context.sha.substring(0, 7)}\` in an isolated container.`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
