name: Deploy PR to Staging

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  pull-requests: write
  packages: write

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  IMAGE_BASE: ghcr.io/alexanderpezarro/landlordsoftware-base
  IMAGE_APP: ghcr.io/alexanderpezarro/landlordsoftware
  STAGING_URL: https://cohold-staging.example.com

jobs:
  check-changes:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    outputs:
      rebuild-base: ${{ steps.changes.outputs.rebuild }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for dependency changes
        id: changes
        run: |
          BASE_SHA=${{ github.event.pull_request.base.sha }}
          HEAD_SHA=${{ github.event.pull_request.head.sha }}
          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -qE '^(package(-lock)?\.json|client/package(-lock)?\.json|prisma/schema\.prisma|Dockerfile\.base)$'; then
            echo "rebuild=true" >> $GITHUB_OUTPUT
            echo "✓ Base image rebuild required - dependencies changed"
          else
            echo "rebuild=false" >> $GITHUB_OUTPUT
            echo "✓ Skipping base image rebuild - no dependency changes"
          fi

  build-base:
    needs: check-changes
    if: needs.check-changes.outputs.rebuild-base == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push base image
        run: |
          docker build --platform linux/amd64 \
            -t ${{ env.IMAGE_BASE }}:latest \
            -t ${{ env.IMAGE_BASE }}:${{ github.sha }} \
            -f Dockerfile.base .
          docker push ${{ env.IMAGE_BASE }}:latest
          docker push ${{ env.IMAGE_BASE }}:${{ github.sha }}

  build-app:
    needs: [check-changes, build-base]
    if: always() && needs.check-changes.result == 'success' && (needs.build-base.result == 'success' || needs.build-base.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push PR image
        run: |
          docker build --platform linux/amd64 \
            -t ${{ env.IMAGE_APP }}:pr-${{ github.event.pull_request.number }} \
            -t ${{ env.IMAGE_APP }}:${{ github.sha }} \
            -f Dockerfile.app .
          docker push ${{ env.IMAGE_APP }}:pr-${{ github.event.pull_request.number }}
          docker push ${{ env.IMAGE_APP }}:${{ github.sha }}

  deploy-staging:
    needs: build-app
    if: always() && needs.build-app.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci

      - name: Sync compose file
        run: |
          scp -o StrictHostKeyChecking=accept-new compose.yaml \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/srv/cohold/compose.yaml"

      - name: Clean up legacy compose file
        run: |
          ssh -o StrictHostKeyChecking=accept-new \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "rm -f /srv/cohold/docker-compose.yml"

      - name: Deploy PR to staging
        run: |
          ssh -o StrictHostKeyChecking=accept-new \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "cd /srv/cohold && \
             STAGING_TAG=pr-${{ github.event.pull_request.number }} docker compose pull cohold-staging && \
             STAGING_TAG=pr-${{ github.event.pull_request.number }} docker compose up -d cohold-staging"

      - name: Health check
        run: |
          echo "Running health checks on staging (via SSH to bypass Cloudflare)..."
          ssh -o StrictHostKeyChecking=accept-new \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            'for i in $(seq 1 12); do
               echo "Attempt $i/12..."
               if docker exec cohold-staging node -e "
                 require(\"http\").get(\"http://localhost:3000/api/health\", r => process.exit(r.statusCode === 200 ? 0 : 1)).on(\"error\", () => process.exit(1))
               " 2>/dev/null; then
                 echo "✓ Staging health check passed"
                 exit 0
               fi
               echo "✗ Not ready yet, retrying in 10s..."
               sleep 10
             done
             echo "Health check failed"
             docker logs cohold-staging --tail 20
             exit 1'

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- staging-preview-comment -->';
            const body = [
              marker,
              '**Staging deployment ready!**',
              '',
              '| | |',
              '|---|---|',
              `| **URL** | ${{ env.STAGING_URL }} |`,
              `| **Commit** | \`${context.sha.substring(0, 7)}\` |`,
              `| **Image** | \`pr-${{ github.event.pull_request.number }}\` |`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  smoke-test:
    needs: deploy-staging
    if: always() && needs.deploy-staging.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci

      - name: Open SSH tunnel to staging container
        run: |
          CONTAINER_IP=$(ssh -o StrictHostKeyChecking=accept-new \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' cohold-staging")
          echo "Container IP: $CONTAINER_IP"
          ssh -o StrictHostKeyChecking=accept-new -N -f \
            -L 3001:"$CONTAINER_IP":3000 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}"
          echo "SSH tunnel open: localhost:3001 -> $CONTAINER_IP:3000"

      - name: Run smoke tests
        id: smoke
        run: npm run test:e2e
        env:
          STAGING_URL: http://localhost:3001
          SMOKE_TEST_PASSWORD: ${{ secrets.SMOKE_TEST_PASSWORD }}

      - name: Upload trace on failure
        if: failure() && steps.smoke.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-pr-${{ github.event.pull_request.number }}
          path: playwright-report/
          retention-days: 7

      - name: Update PR comment with smoke test result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- staging-preview-comment -->';
            const passed = '${{ steps.smoke.outcome }}' === 'success';
            const smokeStatus = passed
              ? '✓ Smoke tests passed'
              : '✗ Smoke tests failed — [see artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})';

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (!existing) return;

            const updatedBody = existing.body + '\n| **Smoke tests** | ' + smokeStatus + ' |';
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body: updatedBody,
            });

  revert-staging:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci

      - name: Revert staging to latest
        run: |
          ssh -o StrictHostKeyChecking=accept-new \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "cd /srv/cohold && \
             STAGING_TAG=latest docker compose pull cohold-staging && \
             STAGING_TAG=latest docker compose up -d cohold-staging"
