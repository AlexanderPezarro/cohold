services:
  cohold-prod:
    image: ghcr.io/alexanderpezarro/landlordsoftware:latest
    container_name: cohold-prod
    restart: unless-stopped
    volumes:
      - prod-data:/data
    env_file: /opt/cohold/prod.env
    networks:
      - proxy_network

  cohold-staging:
    image: ghcr.io/alexanderpezarro/landlordsoftware:${STAGING_TAG:-latest}
    container_name: cohold-staging
    restart: unless-stopped
    volumes:
      - staging-data:/data
    env_file: /opt/cohold/staging.env
    networks:
      - proxy_network

volumes:
  prod-data:
  staging-data:

networks:
  proxy_network:
    external: true
    name: proxy_network
