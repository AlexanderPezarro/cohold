# Self-hosting compose file for Cohold.
#
#   cp .env.example .env    # then fill in the secrets
#   docker compose -f compose.self-host.yml up -d
#
# Builds the image locally from source, so it works on any architecture and
# needs no registry access. See docs/self-hosting.md.

services:
  cohold:
    build:
      context: .
      dockerfile: Dockerfile
    image: cohold:local
    container_name: cohold
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      # The image stores SQLite and uploads on the /data volume.
      DATABASE_URL: file:/data/cohold.db
      UPLOAD_DIR: /data/uploads
    env_file:
      - .env
    volumes:
      - cohold-data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://localhost:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

volumes:
  cohold-data:
